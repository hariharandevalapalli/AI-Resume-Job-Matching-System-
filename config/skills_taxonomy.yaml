# Skill taxonomy used for rule-based skill extraction.
#
# Each skill has a canonical name, a category, and aliases. Aliases are matched
# case-insensitively with technology-aware word boundaries (so "Java" does not
# match "JavaScript" and "C" does not match "C++"). Ambiguous aliases such as
# "Go", "R" or "React" go in `case_sensitive_aliases` and must match exactly.
# `related` skills earn partial credit when the exact skill is missing.
# Resource links point to official documentation or well-known free courses.

version: "1.0.0"

categories:
  programming_languages:
    label: Programming Languages
    learning_weeks: 6
    practice_project: Build a small command-line tool and publish it with tests and a README.
  web_development:
    label: Web Development
    learning_weeks: 4
    practice_project: Build and deploy a small CRUD web app with authentication.
  data_science:
    label: Data Science & Analytics
    learning_weeks: 4
    practice_project: Analyse a public dataset end to end and publish a notebook with clear findings.
  machine_learning:
    label: Machine Learning & AI
    learning_weeks: 6
    practice_project: Train, evaluate and document a model on a public dataset, including a baseline comparison.
  mlops_devops:
    label: MLOps & DevOps
    learning_weeks: 3
    practice_project: Containerise an existing project and add automated tests and a deployment pipeline.
  cloud:
    label: Cloud Platforms
    learning_weeks: 4
    practice_project: Deploy a small API on a free cloud tier and document the architecture.
  databases:
    label: Databases & Data Engineering
    learning_weeks: 3
    practice_project: Design a schema, load sample data, and write analytical queries for it.
  tools_practices:
    label: Tools & Practices
    learning_weeks: 2
    practice_project: Apply the practice in a team or open-source project and describe the outcome.
  mobile:
    label: Mobile Development
    learning_weeks: 6
    practice_project: Build and publish a small mobile app with offline storage.
  soft_skills:
    label: Soft Skills
    learning_weeks: 2
    practice_project: Lead a small initiative (study group, club project, open-source issue) and document the outcome.

