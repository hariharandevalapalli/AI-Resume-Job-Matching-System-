[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-matcher"
version = "1.0.0"
description = "AI Resume-Job Matcher: an explainable NLP and MLOps-based resume ranking system"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["resume_matcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["resume_matcher"]
